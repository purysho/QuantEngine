name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch supersedes older runs (they were queuing for ~8 minutes each).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Numerical and desktop checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: npm ci
      - name: Validate isolated public-feed collector syntax
        run: node --check experiments/collect_coinbase.mjs
      - run: npm run typecheck
      - name: Numerical tests
        run: npm run test:quant
        env:
          QUANT_PYTHON: python
      - name: Synthetic end-to-end WebSocket to prospective settlement
        run: |
          node tests/live_pipeline_smoke.mjs
          node tests/collector_integrity.mjs
        env:
          QUANT_PYTHON: python
      - name: Desktop tests
        run: npm test
        env:
          QUANT_PYTHON: python
      - run: npm run build
      - name: Experiments (measured evidence)
        shell: bash
        run: |
          for script in options_reference first_alpha pairs_cointegration market_making var_backtest; do
            rm -f "experiments/results/$script.json"  # Reject committed/stale evidence.
            python experiments/$script.py > /dev/null
          done
          python experiments/verify_acceptance.py experiments/results/options_reference.json experiments/results/first_alpha.json experiments/results/pairs_cointegration.json experiments/results/market_making.json experiments/results/var_backtest.json
      - name: Native self-test (Linux, Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx electron . --self-test --no-sandbox | tee self-test.log && grep -q QUANT_SELF_TEST_OK self-test.log
        env:
          QUANT_PYTHON: python

  real-data:
    name: Real-data backtests (FRED, Ken French) and evolutionary learning
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Cache public data snapshots (hash-verified on read)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/data
          key: public-data-${{ github.run_id }}
          restore-keys: public-data-
      - name: Remove committed research results before re-running
        run: python -c "from pathlib import Path; [Path('experiments/results', n + '.json').unlink(missing_ok=True) for n in ('real_world_backtest', 'evolution_real', 'strategy_five_year')]"
      - name: 100-year backtest of the maths against what happened
        run: python experiments/real_world_backtest.py
      - name: Prequential evolutionary learning on real data
        run: python experiments/evolution_real.py --offline
      - name: Frozen daily strategies in five-year development windows
        run: python -m experiments.strategy_five_year --offline
      - name: Diagnose failures and test frozen remedies with separate adoption blocks
        env:
          OPENBLAS_NUM_THREADS: 2
          OMP_NUM_THREADS: 2
        run: python -m experiments.strategy_learning --output-dir .cache/strategy-learning-ci
      - name: Matched competitive test with causal situation-dependent decisions
        env:
          OPENBLAS_NUM_THREADS: 2
          OMP_NUM_THREADS: 2
        run: |
          python -m experiments.competitive_test --output-dir .cache/competitive-ci
          python -m experiments.competitive_sharpe --output .cache/competitive-ci/sharpe_sensitivity.json
          python -m experiments.competitive_test --offline --core-tactical --output-dir .cache/core-tactical-ci
          python -m experiments.trade_audit --output-dir .cache/trade-audit-summary-ci --private-dir .cache/trade-audit-private-ci
      - name: Archive competitive evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: competitive-evidence
          path: |
            .cache/competitive-ci/
            .cache/core-tactical-ci/
            .cache/trade-audit-summary-ci/
          if-no-files-found: error
      - name: Archive strategy learning including rejected remedies
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: strategy-learning-evidence
          path: .cache/strategy-learning-ci/
          if-no-files-found: error
      - name: Archive measured evidence including negative research outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: historical-research-evidence
          path: experiments/results/
          if-no-files-found: error
      - name: Research acceptance gate
        run: python experiments/verify_acceptance.py experiments/results/real_world_backtest.json experiments/results/evolution_real.json

  windows-package:
    name: Windows portable package with embedded runtime
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: npm ci
      - name: Prepare SHA-256 verified embedded Python/NumPy/SciPy
        run: python packaging/prepare_runtime.py
      - name: Numerical tests on the embedded runtime
        run: npm run test:quant
        env:
          QUANT_PYTHON: ${{ github.workspace }}\runtime\quant-python\python.exe
      - run: npm run build
      - run: npm run package:win
      - name: Packaged executable self-test
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release -Recurse -Filter QuantEngine.exe | Select-Object -First 1
          if (-not $exe) { throw 'QuantEngine.exe was not produced.' }
          $process = Start-Process -FilePath $exe.FullName -ArgumentList '--self-test' -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput self-test.log -RedirectStandardError self-test.err
          Get-Content self-test.log, self-test.err
          if ($process.ExitCode -ne 0) { throw "Self-test exited with $($process.ExitCode)" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: QuantEngine-win-x64
          path: release/
          if-no-files-found: error
          retention-days: 14

  security:
    name: Dependency audit and CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: npm ci
      - name: Audit pinned Python requirements with PyPA pip-audit
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt -r requirements-dev.txt
      - name: Fail on high-severity npm vulnerabilities
        run: npm audit --audit-level=high
      - name: Generate CycloneDX dependency manifest
        run: npm sbom --sbom-format=cyclonedx --sbom-type=application > quantengine.cdx.json
      - name: Archive reproducible dependency manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quantengine-cyclonedx
          path: quantengine.cdx.json
